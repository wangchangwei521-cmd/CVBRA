  frames: 6578
  video_sequences: 8
  annotation: data/processed/auair_1hz/annotations/auair_1hz.coco.json
  selection_manifest: data/processed/auair_1hz/selection_manifest.json
  categories:
    detector_class_0: 1
    detector_class_1: 2
    detector_class_2: 3
  evaluated_image_scope: all_6578_annotation_images
models:
  source:
    role: frozen_historical_anchor_reused_without_reinference
